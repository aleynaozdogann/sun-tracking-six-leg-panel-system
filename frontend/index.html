<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Solar Tracking</title>


  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      width: 420px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #cbd5f5;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 14px;
      box-sizing: border-box;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #f59e0b;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn:hover {
      background: #fbbf24;
    }

    .result-box {
      margin-top: 24px;
    }

    #result-text {
      white-space: pre-line;
      line-height: 1.6;
      color: #e2e8f0;
    }

    .note {
      margin-top: 12px;
      font-size: 13px;
      color: #94a3b8;
    }


  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>AI Solar Tracking System</h1>
      <p class="subtitle">Predict panel response from sun vector inputs.</p>

      <form id="solar-form" class="form">
        <div class="input-group">
          <label for="sun_x">Sun X</label>
          <input type="number" id="sun_x" step="any">
        </div>

        <div class="input-group">
          <label for="sun_y">Sun Y</label>
          <input type="number" id="sun_y" step="any">
        </div>

        <div class="input-group">
          <label for="sun_z">Sun Z</label>
          <input type="number" id="sun_z" step="any">
        </div>

        <button type="submit" class="btn">Predict</button>
      </form>


    <div class="result-box">
        <h2>Result</h2>
        <p id="result-text">Result will appear here</p>
        <p class="note">Analytic zenith is the physical reference. ML estimate is shown for comparison.</p>
    </div>

      <div class="result-box">
          <h2>Recent Predictions</h2>
          <div id="history-list">
              No history yet.
          </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("solar-form");
    const historyList = document.getElementById("history-list");



    async function loadHistory() {
        const response = await fetch("https://sun-tracking-six-leg-panel-system.onrender.com/history");
        const data = await response.json();
        console.log(data);

        historyList.innerHTML = "";
        const predictions = data.predictions;

        if (predictions.length === 0) {
            historyList.textContent = "No history yet.";
            return;
        }

        for (const item of predictions) {
            historyList.innerHTML +=
                "Required: " + item.analytic_zenith.toFixed(2) + "° | " +
                "ML: " + item.predicted_zenith.toFixed(2) + "° | " +
                "Error: " + item.error.toFixed(2) + "°<br>";
        }
    }
    loadHistory();

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      const sunX = parseFloat(document.getElementById("sun_x").value);
      const sunY = parseFloat(document.getElementById("sun_y").value);
      const sunZ = parseFloat(document.getElementById("sun_z").value);

      const resultText = document.getElementById("result-text");

      if (Number.isNaN(sunX) || Number.isNaN(sunY) || Number.isNaN(sunZ)) {
        resultText.textContent = "Please enter valid numeric values for all inputs.";
        return;
      }

      try {
        const response = await fetch("https://sun-tracking-six-leg-panel-system.onrender.com/predict", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            sun_x: sunX,
            sun_y: sunY,
            sun_z: sunZ
          })
        });

        if (!response.ok) {
          throw new Error("API request failed");
        }

        const data = await response.json();

        console.log("API response:", data);

        const predicted = Number(data.predicted_zenith);
        const analytic = Number(data.analytic_zenith);


        const error = Math.abs(analytic - predicted);

        resultText.textContent =
          `Required Zenith: ${analytic.toFixed(2)}°\n` +
          `ML Estimate: ${predicted.toFixed(2)}°\n` +
          `Error: ${error.toFixed(2)}°`;

      loadHistory();

      } catch (error) {
        console.error("Error:", error);
        resultText.textContent = "Error connecting to API.";
      }
    });
  </script>
</body>
</html>
